name: Deploy Quartz site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - v4

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      THEME_NAME: catppuccin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info

      - name: Clone notes
        run: rm -rf content && git clone --depth 1 https://${{ secrets.NOTES_ACCESS_TOKEN }}@github.com/yavidor/obsidian.git content

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # It's not really a secret
      - name: Prepare Environment Secrets
        env:
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
        run: |
          sed -i "s/GOATCOUNTER_SECRET_HERE/${GOATCOUNTER_CODE}/g" quartz.config.ts

      # - name: Fetch Quartz Theme
      #   run: curl -s -S https://raw.githubusercontent.com/saberzero1/quartz-themes/master/action.sh | bash -s -- $THEME_NAME

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
